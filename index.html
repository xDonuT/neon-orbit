<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PAINT ORBIT</title>
<style>
  :root {
    --neon-cyan: #1f8a9c;
    --neon-magenta: #a04d8c;
    --neon-green: #2f9e70;
    --neon-yellow: #c99a2e;
    --neon-red: #d64f3f;
    --neon-purple: #8a55b8;
    --text: #3d3530;
    --paper: #f2ecdd;
    --ink: #3d3530;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #cfc7b4;
    color: var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    background: #cfc7b4;
  }

  /* ------- HUD top bar (overlay on canvas) ------- */
  #hud {
    position: absolute;
    top: 6px;
    left: auto;
    right: 8px;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    width: max-content;
    max-width: calc(100% - 12px);
    padding: 8px 9px;
    background: rgba(247, 242, 228, 0.92);
    border: 1px solid rgba(120, 90, 50, 0.35);
    border-radius: 6px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 2px 5px rgba(80, 60, 30, 0.18);
    letter-spacing: 0.12em;
    pointer-events: auto;
  }
  #hudInfo {
    position: absolute;
    top: 6px;
    left: 10px;
    z-index: 4;
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 7px 12px;
    background: rgba(247, 242, 228, 0.92);
    border: 1px solid rgba(120, 90, 50, 0.35);
    border-radius: 6px;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset, 0 2px 5px rgba(80, 60, 30, 0.18);
    letter-spacing: 0.12em;
    pointer-events: none;
    max-width: 46%;
  }
  #hudInfoRow {
    display: flex;
    align-items: baseline;
    gap: 10px;
    white-space: nowrap;
  }
  #title {
    font-size: 15px;
    font-weight: bold;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
    white-space: nowrap;
  }
  #hudTimer {
    font-size: 12px;
    color: #8a6a1c;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #levelLabel {
    font-size: 12px;
    color: #5a4a3a;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hud-btn {
    background: rgba(255, 250, 235, 0.6);
    border: 1px solid rgba(97, 76, 48, 0.4);
    color: #4a4038;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.14em;
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .hud-btn:hover { background: rgba(255, 250, 235, 0.9); }
  .hud-btn:active { transform: scale(0.97); }

  /* ------- Canvas wrapper (full screen; canvas letterbox-fit via JS) ------- */
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #cfc7b4;
  }
  canvas, #bounds {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1400 / 850;
    touch-action: none;
    display: block;
  }
  #bounds {
    pointer-events: none;
    z-index: 7;
  }
  canvas { cursor: crosshair; }

  /* ------- Center message overlay ------- */
  #message {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(70, 52, 34, 0.35);
    text-align: center;
    z-index: 5;
    pointer-events: auto;
  }
  #message.hidden { display: none; }
  #msgTitle {
    font-size: clamp(24px, 5vmin, 52px);
    font-weight: bold;
    letter-spacing: 0.25em;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6), 0 2px 6px rgba(80, 60, 30, 0.28);
  }
  #message.lost #msgTitle { color: #a23c2c; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55), 0 2px 6px rgba(80, 60, 30, 0.3); }
  #msgStars {
    font-size: clamp(30px, 7vmin, 56px);
    letter-spacing: 0.3em;
    line-height: 1;
    color: #b57f16;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6), 0 2px 8px rgba(150, 110, 40, 0.35);
  }
  #msgScore {
    font-size: 14px;
    letter-spacing: 0.14em;
    color: #4a4038;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  #msgScore .best { color: #1f7a55; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
  #msgScore .newbest { color: #b57f16; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
  #msgSub {
    font-size: 15px;
    letter-spacing: 0.15em;
    color: #5a4a3a;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  #message.lost #msgSub { color: #8a6a1c; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
  #msgObj {
    display: none;
    font-size: 16px;
    letter-spacing: 0.18em;
    color: #1f6a7d;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  #restartBtn {
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.18em;
    color: var(--ink);
    background: #f7f2e4;
    border: 1.5px solid rgba(97, 76, 48, 0.4);
    border-bottom-width: 3px;
    border-bottom-color: var(--neon-red);
    box-shadow: 0 2px 0 rgba(80, 60, 30, 0.18);
    padding: 10px 26px;
    border-radius: 6px;
    cursor: pointer;
  }
  #restartBtn:hover { background: #fdf9ee; }
  #restartBtn:active { transform: scale(0.97); }
  #msgBtns {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
  }
  #nextLevelBtn {
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 0.18em;
    color: var(--ink);
    background: #f7f2e4;
    border: 1.5px solid rgba(97, 76, 48, 0.4);
    border-bottom-width: 3px;
    border-bottom-color: var(--neon-cyan);
    box-shadow: 0 2px 0 rgba(80, 60, 30, 0.18);
    padding: 11px 30px;
    border-radius: 6px;
    cursor: pointer;
  }
  #nextLevelBtn:hover { background: #fdf9ee; }
  #nextLevelBtn:active { transform: scale(0.97); }

  #toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    max-width: 86%;
    background: rgba(60, 45, 30, 0.88);
    border: 1px solid rgba(230, 205, 150, 0.55);
    color: #f7f1e3;
    font-size: 13px;
    letter-spacing: 0.16em;
    padding: 8px 18px;
    border-radius: 20px;
    white-space: nowrap;
    box-shadow: 0 2px 10px rgba(60, 45, 30, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #toast.show { opacity: 1; }

  /* ------- Footer instructions (overlay on canvas) ------- */
  #footer {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    width: max-content;
    max-width: calc(100% - 12px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #5d5044;
    padding: 4px 10px;
    text-align: center;
    background: rgba(242, 236, 221, 0.78);
    border-radius: 6px;
    pointer-events: none;
  }
  /* ------- Menu screen (start screen) ------- */
  #menu {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(242, 236, 221, 0.92);
    color: var(--ink);
    gap: 24px;
    overflow: hidden;
  }
  #menu.hidden { display: none; }
  #menuTitle { font-size: clamp(32px, 8vmin, 72px); font-weight: bold; letter-spacing: 0.3em; color: var(--ink); text-shadow: 0 2px 0 rgba(255,255,255,0.85), 0 3px 10px rgba(80, 60, 30, 0.3); }
  #menuSub { font-size: 14px; color: #6b5f4f; letter-spacing: 0.15em; margin-bottom: 32px; }
  .menuBtn { font-family: inherit; font-size: 16px; letter-spacing: 0.2em; color: var(--ink); background: rgba(255, 250, 235, 0.6); border: 1px solid rgba(97, 76, 48, 0.4); padding: 12px 28px; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
  .menuBtn:hover { background: rgba(255, 250, 235, 0.9); }
  .menuBtn:active { transform: scale(0.98); }
  .levelsInfo { font-size: 12px; color: #6b5f4f; letter-spacing: 0.1em; }
  /* ------- Level Select overlay ------- */
  #levelSelect {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--ink);
    padding: 20px;
    overflow-y: auto;
    background: rgba(242, 236, 221, 0.94);
  }
  #levelSelect:not(.hidden) { display: flex; }
  .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    vertical-align: middle;
    margin-right: 4px;
    box-shadow: 0 1px 2px rgba(60, 40, 20, 0.35);
  }
  .d-green  { background: var(--neon-green);  color: var(--neon-green); }
  .d-yellow { background: var(--neon-yellow); color: var(--neon-yellow); }
  .d-red    { background: var(--neon-red);    color: var(--neon-red); }
  .d-purple { background: var(--neon-purple); color: var(--neon-purple); }
  .instr-item { white-space: nowrap; }

  /* ------- Compact layout for short / landscape phones ------- */
  #app {
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  @media (max-height: 520px) {
    #hud { gap: 8px; padding: 6px 7px; border-radius: 6px; }
    #hudInfo { padding: 5px 9px; gap: 2px; }
    #title { font-size: 12px; }
    #hudTimer { font-size: 10px; }
    #levelLabel { font-size: 10px; }
    .hud-btn { padding: 4px 9px; font-size: 10px; }
    #footer { padding: 3px 6px; font-size: 10px; gap: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- Menu screen (start screen, hidden after tap) -->
  <div id="menu">
    <div id="menuTitle">PAINT&nbsp;ORBIT</div>
    <div id="menuSub">Keep a bucket, ruin a canvas.</div>
<button class="menuBtn" id="menuStartBtn" aria-label="Start game">Play</button>
<button class="menuBtn" id="menuLevelSelectBtn" aria-label="Level select">Level Select</button>
    <div class="levelsInfo">Levels 1–25</div>
  </div>

  <!-- Game: full screen, canvas + overlays -->
  <div id="wrap">
<canvas id="game" width="1400" height="850" aria-label="Game canvas"></canvas>

<!-- Red danger edge overlay: sits ABOVE the HUD so nothing covers it -->
<canvas id="bounds" width="1400" height="850" aria-hidden="true"></canvas>
    <div id="hudInfo">
      <div id="title">PAINT&nbsp;ORBIT</div>
      <div id="hudInfoRow">
        <div id="hudTimer">0:00</div>
        <div id="levelLabel">LEVEL 1 &mdash; FIRST STEPS</div>
      </div>
    </div>
    <div id="hud">
<button class="hud-btn" id="pauseBtn" aria-label="Pause">PAUSE</button>
<button class="hud-btn" id="sndBtn" aria-label="Sound on">SOUND ON</button>
<button class="hud-btn" id="menuBtn" aria-label="Menu">MENU</button>
    </div>

    <!-- Level Select overlay (hidden by default) -->
    <div id="levelSelect" class="hidden">
      <h3 style="font-size:clamp(24px,5vmin,48px);font-weight:bold;letter-spacing:0.2em;margin-bottom:16px;">PICK A CANVAS</h3>
      <div id="levelSelectGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;width:100%;max-width:400px;"></div>
      <div style="display:flex;gap:12px;margin-top:16px;">
<button class="menuBtn" id="levelSelectClose" aria-label="Close level select">Close</button>
<button class="menuBtn" id="resetProgressBtn" style="border-color:rgba(154,58,40,0.6);color:#7a2c22;" aria-label="Reset progress">Reset Progress</button>
      </div>
    </div>

    <div id="message" class="hidden" aria-live="assertive">
      <div id="msgTitle"></div>
      <div id="msgStars"></div>
      <div id="msgScore"></div>
      <div id="msgObj"></div>
      <div id="msgSub"></div>
      <div id="msgBtns">
<button id="restartBtn" aria-label="Restart level">RESTART LEVEL</button>
<button id="nextLevelBtn" aria-label="Next level">NEXT LEVEL &#8594;</button>
      </div>
    </div>
    <div id="toast" aria-live="polite"></div>

    <!-- Bottom instructions overlay -->
    <div id="footer">
      <span class="instr-item">HOLD to grab &amp; swing &middot; RELEASE to fly</span>
      <span class="instr-item"><span class="dot d-green"></span>swing</span>
      <span class="instr-item"><span class="dot d-yellow"></span>cadmium</span>
      <span class="instr-item"><span class="dot d-red"></span>alizarin &mdash; avoid</span>
      <span class="instr-item"><span class="dot d-purple"></span>sign spot</span>
    </div>
  </div>
</div>

<script>
'use strict';

/* ============================================================
   PAINT ORBIT - single-file swing game (bucket & canvas)
   ============================================================ */

// ---------- Canvas ----------
const W = 1400, H = 850;
const canvas = document.getElementById('game');
const boundsOverlay = document.getElementById('bounds');
const ctx = canvas.getContext('2d');
const boundsCtx = boundsOverlay.getContext('2d');

// ---------- Physics constants (tuned at 60 fps) ----------
const DRAG          = 0.999;   // free-flight air drag per frame (lower = floatier)
const GRAVITY       = 0.02;    // very gentle gravity (px / frame^2)
const TETHER_RANGE  = 450;     // max attach distance to an orb
const MIN_TETHER    = 20;      // minimum swing radius
const MIN_SPIN      = 0.04;    // rad/frame guarantee so swing never feels dead
const RELEASE_BOOST = 1.2;     // pop on release
const TURBO_MULT    = 2.0;     // turbo multiplies angular velocity on attach
const TURBO_ACCEL   = 1.004;   // turbo continuously speeds up while held
const TURBO_CAP     = 0.14;    // rad/frame cap on turbo spin
const REPEL_EXPAND  = 0.8;     // red orb pushes the tether radius outward (px/frame)
const REPEL_LIMIT   = 400;     // red orb auto-releases once radius exceeds this
const PLAYER_R      = 6;

// ---------- Goal landing tiers ("momentum is your weapon") ----------
const WIN_SPEED_SOFT = 7;      // px/frame below this = soft landing
const WIN_SPEED_POWER = 12;    // px/frame at/above this = MASSIVE burst
// per-tier goal FX: [hit-stop s, slow-mo s, flash alpha]
const WIN_FX = [
  { halt: 0.08, slow: 0.5,  flash: 0.18 },   // SOFT
  { halt: 0.12, slow: 0.8,  flash: 0.5  },   // POWER
  { halt: 0.20, slow: 1.3,  flash: 0.85 },   // MASSIVE
];
const BURST_CFG = [
  { sparks: 12, spMin: 0.8,  spMax: 2.4, sizeMin: 1.2, sizeMax: 2.2, rings: [{ r: 8,  vr: 6,  life: 0.5 }] },
  { sparks: 24, spMin: 1.6,  spMax: 5.5, sizeMin: 1.6, sizeMax: 3.2, rings: [{ r: 8,  vr: 9,  life: 0.65 }, { r: 4, vr: 6.5, life: 0.45 }] },
  { sparks: 80, spMin: 2.5,  spMax: 9.5, sizeMin: 2.0, sizeMax: 4.5, rings: [{ r: 10, vr: 12, life: 0.8 }, { r: 6, vr: 9, life: 0.6 }, { r: 3, vr: 7, life: 0.5 }] },
];
const OUT_MARGIN    = 50;      // death buffer beyond canvas edges

// ---------- Levels ----------
const LEVELS = [
  { name: 'FIRST STEPS',   player: {x:130, y:425, vx:0, vy:0}, goal: {x:1090, y:425, r:55},
    orbs:  [ orb(430, 425, 'normal') ], walls: [] },

  { name: 'TWO ORBS',      player: {x:120, y:540, vx:0, vy:0}, goal: {x:1080, y:580, r:50},
    orbs:  [ orb(360, 540, 'normal'), orb(660, 420, 'normal') ], walls: [] },

  { name: 'DIAGONAL SWING',player: {x:110, y:660, vx:0, vy:0}, goal: {x:1080, y:480, r:48},
    orbs:  [ orb(330, 610, 'normal'), orb(570, 520, 'normal'), orb(800, 620, 'normal') ], walls: [] },

  { name: 'MEET CADMIUM',   player: {x:120, y:580, vx:0, vy:0}, goal: {x:1020, y:520, r:45},
    orbs:  [ orb(330, 580, 'turbo'), orb(650, 460, 'normal') ], walls: [] },

  { name: 'CADMIUM SPIN',   player: {x:110, y:250, vx:0, vy:0}, goal: {x:1260, y:450, r:45},
    orbs:  [ orb(300, 420, 'turbo'), orb(560, 250, 'normal'), orb(820, 420, 'turbo'), orb(1080, 250, 'normal') ], walls: [] },

  { name: 'TAPED OFF',   player: {x:110, y:480, vx:0, vy:0}, goal: {x:1140, y:600, r:48},
    orbs:  [ orb(300, 480, 'normal'), orb(640, 680, 'normal') ],
    walls: [ wall(430, 300, 260, 60) ] },

  { name: 'SPLASH BACK',     player: {x:120, y:500, vx:0, vy:0}, goal: {x:1230, y:500, r:50},
    orbs:  [ orb(320, 500, 'normal'), orb(640, 500, 'normal'), orb(910, 500, 'repel') ], walls: [] },

  { name: 'SOAK AND GO',   player: {x:110, y:500, vx:0, vy:0}, goal: {x:1140, y:700, r:48},
    orbs:  [ orb(300, 560, 'turbo'), orb(520, 620, 'normal'), orb(740, 260, 'repel'), orb(860, 660, 'turbo') ], walls: [] },

  { name: 'THE CATWALK', player: {x:100, y:700, vx:0, vy:0}, goal: {x:1210, y:500, r:44},
    orbs:  [ orb(280, 640, 'normal'), orb(520, 500, 'turbo'), orb(760, 620, 'normal'), orb(960, 400, 'turbo') ], walls: [] },

  { name: 'THE BRIDGE',    player: {x:100, y:450, vx:0, vy:0}, goal: {x:1080, y:600, r:48},
    orbs:  [ orb(280, 450, 'normal'), orb(620, 450, 'normal') ],
    walls: [ wall(400, 300, 260, 40), wall(400, 560, 260, 60) ] },

  { name: 'SQUEEZE IN',  player: {x:120, y:720, vx:0, vy:0}, goal: {x:1240, y:480, r:44},
    orbs:  [ orb(280, 660, 'normal'), orb(640, 560, 'normal'), orb(860, 600, 'turbo'), orb(1080, 500, 'normal') ],
    walls: [ wall(400, 380, 220, 36) ] },

  { name: 'CADMIUM CASCADE', player: {x:100, y:640, vx:0, vy:0}, goal: {x:1330, y:500, r:42},
    orbs:  [ orb(300, 640, 'turbo'), orb(540, 500, 'normal'), orb(780, 640, 'turbo'), orb(1000, 460, 'normal'), orb(1200, 600, 'turbo') ], walls: [] },

  { name: 'ALIZARIN RUN',     player: {x:100, y:550, vx:0, vy:0}, goal: {x:1330, y:550, r:42},
    orbs:  [ orb(300, 550, 'normal'), orb(520, 380, 'repel'), orb(520, 720, 'repel'), orb(680, 550, 'normal'), orb(1040, 550, 'turbo') ], walls: [] },

  { name: 'THE RIBBON',   player: {x:110, y:500, vx:0, vy:0}, goal: {x:1300, y:300, r:40},
    orbs:  [ orb(280, 500, 'normal'), orb(560, 320, 'turbo'), orb(870, 520, 'normal'), orb(1120, 320, 'turbo') ],
    walls: [ wall(400, 400, 60, 250), wall(720, 150, 60, 250), wall(1040, 400, 60, 250) ] },

  { name: 'DOUBLE DIP', player: {x:110, y:450, vx:0, vy:0}, goal: {x:1280, y:450, r:40},
    orbs:  [ orb(280, 450, 'normal'), orb(480, 300, 'repel'), orb(480, 600, 'repel'), orb(660, 450, 'normal'),
             orb(860, 300, 'repel'), orb(860, 600, 'repel'), orb(1040, 450, 'turbo') ],
    walls: [ wall(700, 120, 200, 40), wall(700, 690, 200, 40) ] },

  { name: 'ROPE TWIST',  player: {x:110, y:250, vx:0, vy:0}, goal: {x:1200, y:220, r:40},
    orbs:  [ orb(300, 250, 'turbo'), orb(480, 600, 'normal'), orb(760, 340, 'normal') ],
    walls: [ wall(420, 350, 220, 40), wall(700, 450, 220, 40) ] },

  { name: 'THE FUNNEL', player: {x:110, y:400, vx:0, vy:0}, goal: {x:1260, y:400, r:42},
    orbs:  [ orb(280, 400, 'normal'), orb(480, 330, 'repel'), orb(660, 470, 'normal'), orb(840, 350, 'repel'), orb(1020, 430, 'turbo') ],
    walls: [ wall(300, 180, 800, 40), wall(300, 580, 800, 40) ] },

  { name: 'VARNISH ROOM',  player: {x:110, y:700, vx:0, vy:0}, goal: {x:1290, y:690, r:42},
    orbs:  [ orb(300, 620, 'normal'), orb(660, 450, 'turbo'), orb(660, 310, 'repel'), orb(660, 590, 'repel'), orb(1040, 440, 'normal') ],

// ---- Mastery par table (seconds) ----
// 3-star par for each level. 2-star = par * 1.6, 1-star = par * 3.0.
const PAR3 = [6, 7, 7, 7, 8, 8, 8, 9, 10, 10, 11, 11, 12, 12, 13, 13, 14, 14, 15, 15, 16, 17, 17, 18, 19];
function starsForTime(li, t) {
  const p = PAR3[li];
  if (t <= p) return 3;
  if (t <= p * 1.6) return 2;
  if (t <= p * 3.0) return 1;
  return 0;
}

function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m > 0 ? m + ':' + String(sec.toFixed(1)).padStart(4, '0') : sec.toFixed(1) + 's';
}

// ---- Persisted progress & best times ----
// save = { unlocked: [0,3,...] (indices the player may enter), best: { "3": {stars, time}, ... } }
function loadSave() {
  try {
    if (typeof localStorage === 'undefined') return { unlocked: [0], best: {} };
    const raw = localStorage.getItem('neonOrbitSave');
    if (raw) {
      const s = JSON.parse(raw);
      if (Array.isArray(s.unlocked)) return { unlocked: s.unlocked, best: s.best || {} };
    }
    // migrate legacy neonOrbitCompleted array -> unlocked list
    const legacy = localStorage.getItem('neonOrbitCompleted');
    if (legacy) {
      const arr = JSON.parse(legacy);
      if (Array.isArray(arr)) return { unlocked: arr, best: {} };
    }
  } catch (e) { /* storage unavailable */ }
  return { unlocked: [0], best: {} };
}
function writeSave(s) {
  try { if (typeof localStorage !== 'undefined') localStorage.setItem('neonOrbitSave', JSON.stringify(s)); } catch (e) {}
}

/* ============================================================
   PHYSICS
   ============================================================ */

// Press: attach the player to the nearest orb within tether range.
function tryAttach() {
  if (tethered || status !== 'playing') return;
  ensureAudio();

  let best = null, bestD = Infinity;
  for (const o of level.orbs) {
    const d = Math.hypot(player.x - o.x, player.y - o.y);
    if (d <= TETHER_RANGE && d < bestD) { bestD = d; best = o; }
  }
  if (!best) return;

  const dx = player.x - best.x;
  const dy = player.y - best.y;
  const dist = Math.max(MIN_TETHER, bestD);

  // signed tangential speed from the cross product of (radius, velocity)
  const signedTangSpeed = (-dy * player.vx + dx * player.vy) / dist;
  let angVel = signedTangSpeed / dist;      // rad/frame
if (best.type === 'turbo') {
    angVel *= TURBO_MULT;                   // turbo: double the spin on attach
    toast('CADMIUM \u2014 keep holding to pile on the spin!');
  } else if (best.type === 'repel') {

    if (dist > REPEL_LIMIT) {               // too far out: just a gentle shove
      const rx = dx / dist, ry = dy / dist;
      player.vx += rx * 2.5;
      player.vy += ry * 2.5;
      toast('\u26A0 ALIZARIN \u2014 beware, it flips the bucket loose!');
      return;
    }
    // repel forces the OPPOSITE spin direction
    const reversed = -Math.sign(signedTangSpeed || 1) *
                     Math.max(Math.abs(angVel) * 0.8, MIN_SPIN);
    angVel = reversed;
  }

  // guarantee a minimum spin so the swing never feels dead
  if (Math.abs(angVel) < MIN_SPIN) angVel = Math.sign(angVel || 1) * MIN_SPIN;

  tethered = true;
  snap = 1;
  paintRGB = orbColors[best.type].paint;
  rings.push({ x: best.x, y: best.y, r: best.r * 0.5, vr: 2.2, life: 0.30, col: '255,255,255' });
  tether = {
    orb:   best,
    angVel: angVel,
    dist:  dist,
    angle: Math.atan2(dy, dx),
    turbo: best.type === 'turbo',
    repel: best.type === 'repel'
  };
  playAttach(best.type, bestD);
}

// Release: convert the circular motion back into linear velocity.
// During tethering we integrate velocity from the actual displacement,
// so this is perfectly seamless; boost gives the release its "pop".
function release() {
  if (!tethered) return;
  if (pathFadeAt < 0) pathFadeAt = time;
  const spd = Math.hypot(player.vx, player.vy);   // pre-boost, drives the whoosh pitch
  playRelease(spd);
  if (tether.repel) { player.vx *= 0.9; player.vy *= 0.9; }
  else              { player.vx *= RELEASE_BOOST; player.vy *= RELEASE_BOOST; }
  tethered = false;
  tether = null;
  lastBelow = null;
  creakCd = 0;
  dripAcc = 0;
}

function update(dt) {
  time += dt;
  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) elToast.classList.remove('show');
  }

  // brief full freeze right after crossing the goal (hit-stop)
  if (winHalt > 0) { winHalt -= dt / 60; return; }

  // slow-motion ramp while the win burst plays out
  let ts = 1;
  if (winSlow > 0) {
    winSlow -= dt / 60;
    ts = 0.35 + 0.65 * (winSlow / winSlowMax);   // eases back up to normal speed
  }

  if (flashAlpha > 0) flashAlpha *= Math.pow(0.93, dt);
  if (flashAlpha < 0.02) flashAlpha = 0;

  // goal-burst effects keep animating across all statuses
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.life -= dt / 60;
    p.x += p.vx * dt * ts; p.y += p.vy * dt * ts;
    p.vy += 0.02 * dt * ts;
    if (p.life <= 0) sparks.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += r.vr * dt * ts;
    r.life -= dt / 60;
    if (r.life <= 0) rings.splice(i, 1);
  }
  for (let i = beams.length - 1; i >= 0; i--) {
    beams[i].life -= dt / 60;
    if (beams[i].life <= 0) beams.splice(i, 1);
  }
  if (winLabelT > 0) winLabelT -= dt / 60;

  // sound: silence the beds the moment play stops
  if (status !== 'playing') { setRush(0); stopTurboBed(); }

  if (status === 'paused' || status === 'ready') return;   // freeze physics while paused/ready

  if (status !== 'playing') {
    // 'lost' auto-restarts after a moment; 'won' waits for NEXT LEVEL tap
    if (status === 'lost') {
      statusTimer -= dt * ts;
      if (statusTimer <= 0) loadLevel(levelIndex);   // restart current
    }
    return;   // freeze physics, keep background animating
  }

  runTime += dt / 60;   // wall-clock seconds spent in play
  elHudTimer.textContent = fmtTime(runTime);

  // air-rush bed follows the spin: whisper -> screaming at turbo cap
  if (tethered) {
    const tspd = Math.abs(tether.angVel) * tether.dist;
    setRush(Math.min(1, Math.max(0, (tspd - 3) / 14)));
  } else {
    const fspd = Math.hypot(player.vx, player.vy);
    setRush(Math.min(0.3, Math.max(0, (fspd - 6) / 40)));
  }

  if (!tethered) {
    // ---- free flight ----
    player.vx *= Math.pow(DRAG, dt);
    player.vy *= Math.pow(DRAG, dt);
    player.vy += GRAVITY * dt;
    player.x  += player.vx * dt;
    player.y  += player.vy * dt;
  } else {
    // ---- tethered: pure circular motion around the orb ----
    const t = tether, o = t.orb;

    if (t.turbo) {
      // turbo: continuous speed-up while held, capped
      t.angVel = Math.min(t.angVel * Math.pow(TURBO_ACCEL, dt), TURBO_CAP);
      updateTurboBed(Math.abs(t.angVel) / TURBO_CAP);   // "I'm building speed" tell
    }
    if (t.repel) {
      // repel: slowly push the tether radius outward...
      t.dist = Math.min(t.dist + REPEL_EXPAND * dt, REPEL_LIMIT);
      if (t.dist >= REPEL_LIMIT) {        // ...then auto-release
        playKick();
        toast('\u26A0 RED kicked you loose!');
        release(); return;
      }
    }

    const prevX = player.x, prevY = player.y;
    t.angle += t.angVel * dt;
    player.x = o.x + Math.cos(t.angle) * t.dist;
    player.y = o.y + Math.sin(t.angle) * t.dist;

    // derive velocity from real displacement -> smooth seamless release
    if (dt > 0) {
      player.vx = (player.x - prevX) / dt;
      player.vy = (player.y - prevY) / dt;
    }

    // ---- tether paint-splatter (subtle drips from the orb) ----
    if (Math.random() < 0.18) {
      const color = t.repel ? orbColors.repel.paint : (t.turbo ? orbColors.turbo.paint : orbColors.normal.paint);
      tetherParticles.push({
        x: o.x + (Math.random() - 0.5) * 10,
        y: o.y + (Math.random() - 0.5) * 10,
        vx: (Math.random() - 0.5) * 2,
        vy: 1.5 + Math.random() * 2.5,
        r: 2 + Math.random() * 3,
        life: 0.6 + Math.random() * 0.4,
        color: color
      });
    }

    // rope tension creak at the bottom of the arc (once per half-orbit)
    const below = player.y > o.y + 6;
    if (below && !lastBelow && creakCd <= 0 && Math.abs(t.angVel) * t.dist > 5) {
      playCreak();
      creakCd = 0.4;
    }
    lastBelow = below;
    if (creakCd > 0) creakCd -= dt / 60;

    // faint drip ticks while held - denser the faster you go
    dripAcc -= dt;
    if (dripAcc <= 0) {
      dripAcc = Math.max(0.12, 1.1 - Math.abs(t.angVel) * t.dist * 0.05);
      if (Math.random() < 0.55) playDrip(0.032);
    }

    // keep tetherParticles alive
    for (let i = tetherParticles.length - 1; i >= 0; i--) {
      const p = tetherParticles[i];
      p.life -= dt / 60;
      p.y += p.vy * dt;
      p.x += p.vx * dt;
      p.vy += 0.04 * dt; // gravity pull
      if (p.life <= 0) tetherParticles.splice(i, 1);
    }
  }

  // ---- collisions / win-lose checks ----
  if (checkGoal())                  { win();  return; }
  if (checkWalls())                 { loseCause = 'SMACKED THE TAPE!'; lose(); return; }
  if (checkBounds())                { loseCause = 'LEFT THE STUDIO!';   lose(); return; }

  // trail history - longer/denser the faster you go
  trail.unshift({ x: player.x, y: player.y });
  const targetLen = 22 + Math.min(18, Math.hypot(player.vx, player.vy) * 2.2);
  while (trail.length > targetLen) trail.pop();

  // persistent wet paint: the bucket keeps the canvas stained
  addPaintStroke(player.x, player.y, Math.hypot(player.vx, player.vy), paintRGB);

  snap *= Math.pow(0.84, dt);   // attach pop decays
}

function checkGoal() {
  const g = level.goal;
  return Math.hypot(player.x - g.x, player.y - g.y) < g.r + PLAYER_R;
}

function checkWalls() {
  for (const w of level.walls) {
    // closest point on the rectangle to the player center
    const cx = Math.max(w.x, Math.min(player.x, w.x + w.w));
    const cy = Math.max(w.y, Math.min(player.y, w.y + w.h));
    if (Math.hypot(player.x - cx, player.y - cy) <= PLAYER_R) return true;
  }
  return false;
}

function checkBounds() {
  return player.x < -OUT_MARGIN || player.x > W + OUT_MARGIN ||
         player.y < -OUT_MARGIN || player.y > H + OUT_MARGIN;
}

// ---------- win / lose ----------
function spawnGoalBurst(tier) {
  const g = level.goal;
  const colors = ['#8a55b8', '#e0af3c', '#2f9e70', '#e4513f'];
  const cfg = BURST_CFG[tier];
  for (let i = 0; i < cfg.sparks; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = cfg.spMin + Math.random() * (cfg.spMax - cfg.spMin);
    sparks.push({
      x: g.x, y: g.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 1,
      size: cfg.sizeMin + Math.random() * (cfg.sizeMax - cfg.sizeMin),
      color: colors[(Math.random() * colors.length) | 0],
    });
  }
  for (const r of cfg.rings) rings.push({ x: g.x, y: g.y, r: r.r, vr: r.vr, life: r.life });

  if (tier === 2) {
    // MASSIVE only: radial energy beams exploding from the goal
    for (let i = 0; i < 16; i++) {
      beams.push({
        x: g.x, y: g.y,
        a: (Math.PI * 2 * i) / 16 + Math.random() * 0.22,
        maxLen: 70 + Math.random() * 110,
        width: 3.5 + Math.random() * 2.5,
        life: 0.55 + Math.random() * 0.25,
        rgb: Math.random() < 0.35 ? '184,135,27' : '76,58,34',
      });
    }
  }
}

function win() {
  const last = levelIndex === LEVELS.length - 1;
  const speed = Math.hypot(player.vx, player.vy);
  landTier = speed >= WIN_SPEED_POWER ? 2 : speed >= WIN_SPEED_SOFT ? 1 : 0;
  const fx = WIN_FX[landTier];

  // ---- mastery result: stars (by time) + track best ----
  const t = runTime;
  const stars = starsForTime(levelIndex, t);
  let wasNewBest = false;
  let prevBest = null;
  try {
    const save = loadSave();
    const rec = save.best[levelIndex];
    prevBest = rec && isFinite(rec.time) ? rec.time : null;
    if (!rec || t < rec.time) { save.best[levelIndex] = { stars, time: t }; wasNewBest = true; }
    // pre-unlock the next level
    const nextIdx = levelIndex + 1;
    if (nextIdx < LEVELS.length && !save.unlocked.includes(nextIdx)) save.unlocked.push(nextIdx);
    if (!save.unlocked.includes(levelIndex)) save.unlocked.push(levelIndex);
    writeSave(save);
  } catch (e) { /* storage unavailable */ }

  // ---- hide game title during play ----
  const wasTitleVisible = document.getElementById('title').style.display !== 'none';
  if (wasTitleVisible) document.getElementById('title').style.display = 'none';

  status = 'won';
  statusTimer = 2.4 + fx.slow;
  winHalt = fx.halt;
  winSlow = fx.slow;
  winSlowMax = fx.slow;
  flashAlpha = fx.flash;
  winLabelT = 0.9;
  spawnGoalBurst(landTier);
  playWin(landTier);
  stopTurboBed();
  elMsg.classList.remove('lost');
  elMsg.classList.remove('hidden');
  elMsgObj.style.display = 'none';

  // ---- results on the win overlay ----
  elMsgStars.textContent = '\u2605\u2605\u2605'.slice(0, stars) + '\u2606\u2606\u2606'.slice(0, 3 - stars);
  playStarPop(stars);
  const bestTxt = wasNewBest ? 'NEW BEST!' : (prevBest != null ? 'best ' + fmtTime(prevBest) : '');
  elMsgScore.textContent = fmtTime(t) + (bestTxt ? '  \u00b7  ' + bestTxt : '');
  elMsgScore.className = wasNewBest ? 'newbest' : '';
  elMsgT.textContent = stars === 3 ? 'FLAWLESS!' : last ? 'ALL 25 SIGNED!' : 'LEVEL COMPLETE!';
  elMsgS.textContent = last ? 'Back around to FIRST STEPS...' : 'Next: ' + LEVELS[levelIndex + 1].name + ' \u2192';
  elRestart.style.display = 'none';
  elNextBtn.style.display = '';
  elNextBtn.textContent = last ? 'PLAY AGAIN' : 'NEXT LEVEL \u2192';
}

function lose() {
  deathSplatter(player.x, player.y);
  status = 'lost';
  statusTimer = 1.5;
  stopTurboBed();
  playLose(loseCause);
  elMsg.classList.add('lost');
  elMsg.classList.remove('hidden');
  elMsgObj.style.display = 'none';
  elMsgT.textContent = loseCause || 'BACK TO THE ROOM!';
  elMsgS.textContent = 'Tap the screen to retry';
  elRestart.style.display = '';
  elNextBtn.style.display = 'none';
  loseCause = '';
}

/* ============================================================
   RENDERING
   ============================================================ */
const particles = [];
for (let i = 0; i < 44; i++) {
  particles.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.5 + 0.4,
    s: Math.random() * 0.25 + 0.05,
    c: Math.random() < 0.5 ? '112,146,128' : '176,124,92'
  });
}

// Tether paint-splatter particles (one per frame while attached)
let tetherParticles = [];

// static gradients are built once and reused (no per-frame allocations)
let bgGrad = null;
let vignetteGrad = null;
let goalGrad = null;

// ---- offscreen layers (baked once, blitted each frame) ----
// paperLayer: the stretched-sheet background (grain + frame). paintLayer:
// the wet paint the bucket leaves behind - it ACCUMULATES and persists.
// Both are created lazily and skipped where document.createElement is
// unavailable (e.g. the automated test harness), falling back to flat fills.
let paperLayer = null;
let paintCanvas = null;
let paintCtx = null;
let lastPaintX = null, lastPaintY = null;

function makeCtx() {
  if (typeof document === 'undefined' || typeof document.createElement !== 'function') return null;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  return { el: c, ctx: c.getContext('2d') };
}

function ensurePaperLayer() {
  if (paperLayer || typeof document === 'undefined') return;
  const mk = makeCtx();
  if (!mk) { paperLayer = null; return; }
  paperLayer = mk.el;
  const p = mk.ctx;
  p.fillStyle = '#f2ecdd';
  p.fillRect(0, 0, W, H);

  // stretcher bars peeking around the sheet
  p.fillStyle = 'rgba(74,56,38,0.14)';
  p.fillRect(12, 12, W - 24, 9);
  p.fillRect(12, H - 21, W - 24, 9);
  p.fillRect(12, 12, 9, H - 24);
  p.fillRect(W - 21, 12, 9, H - 24);

  // broad, uneven water stains
  const stainA = p.createRadialGradient(W * 0.24, H * 0.3, 10, W * 0.24, H * 0.3, 330);
  stainA.addColorStop(0, 'rgba(122,100,58,0.055)');
  stainA.addColorStop(1, 'rgba(122,100,58,0)');
  p.fillStyle = stainA; p.fillRect(0, 0, W, H);
  const stainB = p.createRadialGradient(W * 0.8, H * 0.72, 10, W * 0.8, H * 0.72, 300);
  stainB.addColorStop(0, 'rgba(158,72,52,0.045)');
  stainB.addColorStop(1, 'rgba(158,72,52,0)');
  p.fillStyle = stainB; p.fillRect(0, 0, W, H);

  // fiber grain: fine specks + short strands
  for (let i = 0; i < 2400; i++) {
    const gx = Math.random() * W, gy = Math.random() * H;
    const gw = Math.random() * 1.6 + 0.4;
    p.fillStyle = Math.random() < 0.5 ? 'rgba(88,66,40,0.055)' : 'rgba(46,36,24,0.05)';
    p.fillRect(gx, gy, gw, gw * 0.4);
  }
  p.strokeStyle = 'rgba(88,66,40,0.06)';
  p.lineWidth = 0.6;
  for (let i = 0; i < 200; i++) {
    const sx = Math.random() * W, sy = Math.random() * H;
    const sa = Math.random() * Math.PI;
    p.beginPath();
    p.moveTo(sx, sy);
    p.lineTo(sx + Math.cos(sa) * (8 + Math.random() * 26), sy + Math.sin(sa) * (8 + Math.random() * 26));
    p.stroke();
  }
}

function ensurePaintLayer() {
  if (paintCanvas || typeof document === 'undefined') return;
  const mk = makeCtx();
  if (!mk) { paintCanvas = null; return; }
  paintCanvas = mk.el;
  paintCtx = mk.ctx;
}

// stamp the current wet-paint streak onto the persistent paint layer
function addPaintStroke(x, y, spd, rgb) {
  ensurePaintLayer();
  if (!paintCtx) return;
  if (lastPaintX !== null && spd > 0.6) {
    paintCtx.lineCap = 'round';
    paintCtx.lineJoin = 'round';
    // broad wet smear
    paintCtx.globalAlpha = 0.16;
    paintCtx.strokeStyle = 'rgb(' + rgb + ')';
    paintCtx.lineWidth = 9 + Math.min(9, spd * 1.4);
    paintCtx.beginPath();
    paintCtx.moveTo(lastPaintX, lastPaintY);
    paintCtx.lineTo(x, y);
    paintCtx.stroke();
    // bright wet core
    paintCtx.globalAlpha = 0.9;
    paintCtx.lineWidth = 3 + Math.min(3, spd * 0.5);
    paintCtx.beginPath();
    paintCtx.moveTo(lastPaintX, lastPaintY);
    paintCtx.lineTo(x, y);
    paintCtx.stroke();
    paintCtx.globalAlpha = 1;
  }
  lastPaintX = x;
  lastPaintY = y;
}

function clearPaintLayer() {
  if (paintCtx) paintCtx.clearRect(0, 0, W, H);
  lastPaintX = lastPaintY = null;
}

// stamp a paint splat where the player died — visual consequence, no gameplay effect
function deathSplatter(x, y) {
  ensurePaintLayer();
  if (!paintCtx) return;
  const rgb = paintRGB;
  const count = 8 + Math.floor(Math.random() * 5);
  paintCtx.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const len = 15 + Math.random() * 35;
    const thick = 2 + Math.random() * 4;
    paintCtx.globalAlpha = 0.4 + Math.random() * 0.5;
    paintCtx.strokeStyle = 'rgb(' + rgb + ')';
    paintCtx.lineWidth = thick;
    paintCtx.beginPath();
    paintCtx.moveTo(x, y);
    paintCtx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    paintCtx.stroke();
  }
  paintCtx.globalAlpha = 0.8;
  paintCtx.fillStyle = 'rgb(' + rgb + ')';
  paintCtx.beginPath();
  paintCtx.arc(x, y, 6 + Math.random() * 4, 0, Math.PI * 2);
  paintCtx.fill();
  paintCtx.globalAlpha = 1;
}

function drawBackground() {
  ensurePaperLayer();
  if (paperLayer) {
    ctx.drawImage(paperLayer, 0, 0);
  } else {
    ctx.fillStyle = '#f2ecdd';
    ctx.fillRect(0, 0, W, H);
  }

  // faint paint flecks drifting over the canvas
  for (const p of particles) {
    p.y += p.s; if (p.y > H + 4) { p.y = -4; p.x = Math.random() * W; }
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = 'rgb(' + p.c + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Full-edge "danger" marker: all four sides of the arena are lethal.
// Pure fill/stroke - no shadowBlur, and the edge gradients are cached once
// (blurring a full-perimeter stroke every frame is a known mobile-jank source).
let boundsGrads = null;   // created lazily with ctx dimensions available
function makeBoundsGrads() {
  const g = boundsCtx;
  const band = 22;
  const comp = 'rgba(190,44,34,';
  const mk = (from, to, dir) => {
    const gr = dir === 'v' ? g.createLinearGradient(0, from, 0, to)
                           : g.createLinearGradient(from, 0, to, 0);
    gr.addColorStop(0, comp + '0.14)');
    gr.addColorStop(1, 'rgba(190,44,34,0)');
    return gr;
  };
  return {
    top:    mk(0, band, 'v'),
    bottom: mk(H, H - band, 'v'),
    left:   mk(0, band, 'h'),
    right:  mk(W, W - band, 'h'),
  };
}

// drawn on the #bounds overlay canvas, which sits above the HUD/footer,
// so no UI element can ever cover the danger edge
function drawBounds() {
  const g = boundsCtx;
  if (!boundsGrads) boundsGrads = makeBoundsGrads();
  g.clearRect(0, 0, W, H);
  g.fillStyle = boundsGrads.top;    g.fillRect(0, 0, W, 22);
  g.fillStyle = boundsGrads.bottom; g.fillRect(0, H - 22, W, 22);
  g.fillStyle = boundsGrads.left;   g.fillRect(0, 0, 22, H);
  g.fillStyle = boundsGrads.right;  g.fillRect(W - 22, 0, 22, H);

  g.save();
  g.strokeStyle = 'rgba(190,44,34,0.55)';
  g.lineWidth = 3;
  g.strokeRect(1, 1, W - 2, H - 2);

  // inward chevrons along each edge (steady, subtle)
  g.strokeStyle = 'rgba(190,44,34,0.5)';
  g.lineWidth = 3;
  g.lineCap = 'round';
  const step = 200;
  for (let x = 46; x < W - 30; x += step) {
    g.beginPath(); g.moveTo(x - 8, 5); g.lineTo(x, 14); g.lineTo(x + 8, 5); g.stroke();          // top: points down
    g.beginPath(); g.moveTo(x - 8, H - 5); g.lineTo(x, H - 14); g.lineTo(x + 8, H - 5); g.stroke(); // bottom: points up
  }
  for (let y = 46; y < H - 30; y += step) {
    g.beginPath(); g.moveTo(5, y - 8); g.lineTo(14, y); g.lineTo(5, y + 8); g.stroke();          // left: points right
    g.beginPath(); g.moveTo(W - 5, y - 8); g.lineTo(W - 14, y); g.lineTo(W - 5, y + 8); g.stroke(); // right: points left
  }
  g.restore();
}

// Faint dashed route through the intended chain; fades after the first release.
function drawPathHint() {
  const elapsed = time - pathFadeAt;
  if (pathFadeAt >= 0 && elapsed > 1.0) return;
  const alpha = pathFadeAt < 0 ? 1 : Math.max(0, 1 - elapsed / 1.0);

  const pts = [{ x: level.player.x, y: level.player.y }];
  for (const o of level.orbs) pts.push({ x: o.x, y: o.y });
  pts.push({ x: level.goal.x, y: level.goal.y });

  ctx.save();
  ctx.strokeStyle = 'rgba(155,111,208,' + (0.5 * alpha).toFixed(3) + ')';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 11]);
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawWalls() {
  for (const w of level.walls) {
    // translucent red masking tape: "don't paint here"
    ctx.fillStyle = 'rgba(228,80,66,0.22)';
    ctx.fillRect(w.x, w.y, w.w, w.h);

    // torn tape edge
    ctx.strokeStyle = 'rgba(176,46,34,0.85)';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);

    // diagonal hatch clipped to the strip
    ctx.save();
    ctx.beginPath();
    ctx.rect(w.x, w.y, w.w, w.h);
    ctx.clip();
    ctx.strokeStyle = 'rgba(160,42,32,0.3)';
    ctx.lineWidth = 1.2;
    for (let d = -w.h; d <= w.w; d += 16) {
      ctx.beginPath();
      ctx.moveTo(w.x + d, w.y);
      ctx.lineTo(w.x + d + w.h, w.y + w.h);
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawOrbs() {
  level.orbs.forEach((o, i) => {
    const c = orbColors[o.type];
    ctx.save();
    ctx.shadowColor = c.glow;
    ctx.shadowBlur = 18;
    ctx.fillStyle = c.fill;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // glossy paint puddle highlight
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(o.x - o.r * 0.32, o.y - o.r * 0.32, o.r * 0.34, 0, Math.PI * 2);
    ctx.fill();

    // puddle rim
    ctx.strokeStyle = c.stroke;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(o.x, o.y, o.r + 1, 0, Math.PI * 2);
    ctx.stroke();

    if (o.type === 'turbo') {
      // cadmium is thick - heavier spin arcs
      ctx.strokeStyle = 'rgba(184,135,27,0.7)';
      ctx.lineWidth = 2.5;
      const a0 = time * 4 + i;
      for (let k = 0; k < 2; k++) {
        ctx.beginPath();
        ctx.arc(o.x, o.y, o.r + 6, a0 + k * Math.PI, a0 + k * Math.PI + 1.5);
        ctx.stroke();
      }
    } else if (o.type === 'repel') {
      // alizarin: dashed warning ring + radiating spikes
      ctx.strokeStyle = 'rgba(181,55,42,0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.arc(o.x, o.y, o.r + 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      const a0 = -time * 2 - i;
      for (let k = 0; k < 8; k++) {
        const a = a0 + k * Math.PI / 4;
        ctx.moveTo(o.x + Math.cos(a) * (o.r + 3), o.y + Math.sin(a) * (o.r + 3));
        ctx.lineTo(o.x + Math.cos(a) * (o.r + 11), o.y + Math.sin(a) * (o.r + 11));
      }
      ctx.stroke();
    }

    ctx.restore();
  });
}

function drawGoal() {
  const g = level.goal;
  const pulse = g.r + Math.sin(time * 3) * 4;
  // soft sign-spot fill (cached - rebuilt only when the goal changes)
  if (!goalGrad) {
    goalGrad = ctx.createRadialGradient(g.x, g.y, 4, g.x, g.y, g.r * 0.9);
    goalGrad.addColorStop(0, 'rgba(155,111,208,0.5)');
    goalGrad.addColorStop(1, 'rgba(155,111,208,0.1)');
  }
  ctx.fillStyle = goalGrad;
  ctx.beginPath();
  ctx.arc(g.x, g.y, g.r * 0.9, 0, Math.PI * 2);
  ctx.fill();

  // dashed "sign here" ring
  ctx.strokeStyle = 'rgba(138,85,184,0.8)';
  ctx.lineWidth = 2.5;
  ctx.setLineDash([6, 7]);
  ctx.beginPath();
  ctx.arc(g.x, g.y, pulse, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // registration cross (the spot you sign)
  ctx.strokeStyle = 'rgba(138,85,184,0.6)';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(g.x, g.y - 7); ctx.lineTo(g.x, g.y + 7);
  ctx.moveTo(g.x - 7, g.y); ctx.lineTo(g.x + 7, g.y);
  ctx.stroke();

  // inner pulse with a soft glow
  ctx.shadowColor = 'rgba(138,85,184,0.9)';
  ctx.shadowBlur = 22;
  ctx.strokeStyle = 'rgba(172,132,216,0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(g.x, g.y, pulse - 4, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
}

// Soft arrow pointing at the goal while the ball is flying loose.
function drawBeacon() {
  if (status !== 'playing' || tethered) return;
  const g = level.goal;
  const dx = g.x - player.x, dy = g.y - player.y;
  const d = Math.hypot(dx, dy) || 1;
  const angle = Math.atan2(dy, dx);
  const x0 = player.x + Math.cos(angle) * (PLAYER_R + 10);
  const y0 = player.y + Math.sin(angle) * (PLAYER_R + 10);
  const len = Math.min(80, 24 + d * 0.035);

  ctx.save();
  ctx.strokeStyle = 'rgba(138,85,184,0.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 9]);
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x0 + Math.cos(angle) * (len - 10), y0 + Math.sin(angle) * (len - 10));
  ctx.stroke();
  ctx.setLineDash([]);

  const hx = x0 + Math.cos(angle) * (len - 6);
  const hy = y0 + Math.sin(angle) * (len - 6);
  ctx.fillStyle = 'rgba(172,132,216,0.8)';
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx - Math.cos(angle - 0.45) * 9, hy - Math.sin(angle - 0.45) * 9);
  ctx.lineTo(hx - Math.cos(angle + 0.45) * 9, hy - Math.sin(angle + 0.45) * 9);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawTether() {
  if (!tethered) return;
  const o = tether.orb;
  const dx = o.x - player.x, dy = o.y - player.y;
  const d = Math.hypot(dx, dy) || 1;
  const side = Math.sin(time * 2.2) * Math.min(8, d * 0.02);
  const px = -dy / d, py = dx / d;
  const mx = (player.x + o.x) / 2 + px * side;
  const my = (player.y + o.y) / 2 + py * side;

  ctx.lineCap = 'round';

  // hanging rope (hay-braid tan)
  ctx.strokeStyle = 'rgba(126,94,50,0.9)';
  ctx.lineWidth = 2.6;
  ctx.beginPath();
  ctx.moveTo(player.x, player.y);
  ctx.quadraticCurveTo(mx, my, o.x, o.y);
  ctx.stroke();

  // lighter highlight strand
  ctx.strokeStyle = 'rgba(216,182,120,0.45)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(player.x, player.y);
  ctx.quadraticCurveTo(mx, my, o.x, o.y);
  ctx.stroke();

  // knot at the bucket handle
  ctx.fillStyle = 'rgba(96,70,34,1)';
  ctx.beginPath();
  ctx.arc(player.x + px * 3, player.y + py * 3, 1.7, 0, Math.PI * 2);
  ctx.fill();

  ctx.lineCap = 'butt';
}

function drawTrail() {
  if (trail.length < 2) return;
  const spd = Math.hypot(player.vx, player.vy);
  const gain = 0.7 + Math.min(1.2, spd * 0.07);   // faster -> brighter, wider
  const stride = trail.length > 30 ? 2 : 1;        // long tails: draw every other segment
  ctx.lineCap = 'round';
  for (let i = 0; i < trail.length - 1; i += stride) {
    const t = 1 - i / trail.length;               // 1 near the player
    const a = Math.min(0.5, t * 0.4 * gain);
    ctx.strokeStyle = 'rgba(' + paintRGB + ',' + a.toFixed(3) + ')';
    ctx.lineWidth = (4 * t + 1.2) * (0.7 + 0.45 * gain);
    ctx.beginPath();
    ctx.moveTo(trail[i].x, trail[i].y);
    ctx.lineTo(trail[i + 1].x, trail[i + 1].y);
    ctx.stroke();
  }
}

function drawPlayer() {
  const spd = Math.hypot(player.vx, player.vy);
  const target = 1 + Math.min(0.38, spd * 0.028);   // stretch along motion
  stretchEase += (target - stretchEase) * 0.22;     // ease, so direction flips can't flicker
  const str = stretchEase;
  const pop = 1 + 0.32 * snap;                      // attach pop

  // the tin bucket leans into its flight and tips to pour
  const lean = tethered
    ? Math.max(-0.18, Math.min(0.18, -player.vx * 0.006))
    : Math.max(-0.55, Math.min(0.55, -player.vx * 0.008));

  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.scale(pop * str, pop * (2 - str));
  ctx.rotate(lean);

  const R = PLAYER_R;
  // tapered bucket body (wider mouth, narrow base)
  ctx.fillStyle = '#dfe6ea';
  ctx.strokeStyle = '#77828b';
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  ctx.moveTo(-R * 1.05, -R * 1.5);
  ctx.lineTo(R * 1.05, -R * 1.5);
  ctx.lineTo(R * 0.78, R * 1.05);
  ctx.lineTo(-R * 0.78, R * 1.05);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // open mouth / inner paint visible at the top
  ctx.fillStyle = '#aeb7bd';
  ctx.beginPath();
  ctx.ellipse(0, -R * 1.5, R * 1.05, R * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(' + paintRGB + ',0.9)';
  ctx.beginPath();
  ctx.ellipse(0, -R * 1.5, R * 0.72, R * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();

  // wire bail (handle) over the mouth
  ctx.strokeStyle = '#8c959c';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, -R * 1.5, R * 1.05, Math.PI, 0, false);
  ctx.stroke();

  // pouring stream toward the puddle when tethered
  if (tethered && tether) {
    const o = tether.orb;
    const ang = Math.atan2(o.y - player.y, o.x - player.x);
    ctx.strokeStyle = 'rgba(' + paintRGB + ',0.9)';
    ctx.lineWidth = 1.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, R * 0.8);
    ctx.lineTo(Math.cos(ang) * R * 2.2, R * 0.8 + Math.sin(ang) * R * 2.2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawGoalBurst() {
  // expanding shockwave rings
  ctx.lineWidth = 2.5;
  for (const r of rings) {
    ctx.strokeStyle = r.col ? 'rgba(' + r.col + ',' + (r.life * 1.4).toFixed(3) + ')'
                            : 'rgba(138,85,184,' + (r.life * 1.4).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  // radial energy beams (MASSIVE landings)
  ctx.lineCap = 'round';
  for (const b of beams) {
    const prog = 1 - b.life;                 // 0 -> 1 as it expands
    const len = b.maxLen * prog;
    ctx.strokeStyle = 'rgba(' + b.rgb + ',' + Math.min(1, b.life * 1.6).toFixed(3) + ')';
    ctx.lineWidth = b.width * b.life + 0.5;  // tapers while fading
    ctx.beginPath();
    ctx.moveTo(b.x + Math.cos(b.a) * (len * 0.2), b.y + Math.sin(b.a) * (len * 0.2));
    ctx.lineTo(b.x + Math.cos(b.a) * len, b.y + Math.sin(b.a) * len);
    ctx.stroke();
  }
  // spark particles
  ctx.lineCap = 'round';
  for (const p of sparks) {
    const a = p.life;   // fade out over life
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = Math.min(1, a * 1.4);
    ctx.lineWidth = p.size;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 1.5, p.y - p.vy * 1.5);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // landing tier word ("dab" / "STROKE!" / "SPLASH!!")
  if (winLabelT > 0) {
    const g = level.goal;
    const words = ['dab', 'STROKE!', 'SPLASH!!'];
    ctx.globalAlpha = Math.min(1, winLabelT * 1.6);
    ctx.fillStyle = '#3d3530';
    ctx.font = (landTier === 2 ? 52 : landTier === 1 ? 40 : 26) + 'px 900 system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(words[landTier], g.x, g.y - (landTier === 2 ? 28 : landTier === 1 ? 20 : 12));
    ctx.globalAlpha = 1;
  }
  ctx.lineCap = 'butt';
}

function drawVignette() {
  if (!vignetteGrad) {
    vignetteGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, W * 0.75);
    vignetteGrad.addColorStop(0, 'rgba(96,74,44,0)');
    vignetteGrad.addColorStop(1, 'rgba(96,74,44,0.18)');
  }
  ctx.fillStyle = vignetteGrad;
  ctx.fillRect(0, 0, W, H);
}

function drawTetherParticles() {
  for (const p of tetherParticles) {
    const alpha = Math.min(1, p.life * 1.5);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgb(' + p.color + ')';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function draw() {
  drawBackground();
  if (paintCanvas) ctx.drawImage(paintCanvas, 0, 0);
  drawBounds();
  drawPathHint();
  drawWalls();
  drawOrbs();
  drawGoal();
  drawBeacon();
  drawTether();
  drawTrail();
  drawTetherParticles();
  drawPlayer();
  drawGoalBurst();
  if (flashAlpha > 0) {
    ctx.fillStyle = 'rgba(250,250,255,' + flashAlpha.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  drawVignette();
}

/* ============================================================
   SOUND (Web Audio, synthesized - no external files)
   ============================================================ */
const elSnd = document.getElementById('sndBtn');
let audioCtx = null;
let masterGain = null;
let noiseBuf = null;
let sndOn = true;

// looping air-rush bed (whoosh that tracks spin) and turbo climbing bed
let rushSrc = null, rushFilter = null, rushGain = null, rushTarget = 0;
let turboOsc = null, turboLp = null, turboGain = null;
let creakCd = 0, lastBelow = null, dripAcc = 0;

// small pitch jitter so repeated hits never sound like a ringtone
const det = () => 1 + (Math.random() * 0.07 - 0.035);

function ensureAudio() {
  if (!audioCtx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.32;
      masterGain.connect(audioCtx.destination);

      // looping air-rush bed: quiet always-on noise, swept toward motion
      rushSrc = audioCtx.createBufferSource();
      rushSrc.buffer = noise();
      rushSrc.loop = true;
      rushFilter = audioCtx.createBiquadFilter();
      rushFilter.type = 'bandpass';
      rushFilter.Q.value = 0.8;
      rushFilter.frequency.value = 260;
      rushGain = audioCtx.createGain();
      rushGain.gain.value = 0;
      rushSrc.connect(rushFilter);
      rushFilter.connect(rushGain);
      rushGain.connect(masterGain);
      rushSrc.start(0);
    } catch (e) { /* audio unavailable */ }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

// sweep the air-rush bed:  x in [0..1], quiet at 0, screaming at 1
function setRush(x) {
  if (!audioCtx || !rushFilter || !rushGain) return;
  rushTarget = sndOn ? x : 0;
  const t0 = audioCtx.currentTime;
  rushFilter.frequency.setTargetAtTime(240 + rushTarget * 2800, t0, 0.07);
  rushGain.gain.setTargetAtTime(0.055 * rushTarget, t0, 0.07);
}

// combining tone: attach attack-slide-release envelope
function tone(freq, dur, type, vol, slideTo) {
  if (!sndOn || !audioCtx || !masterGain) return;
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (slideTo !== undefined) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t0 + dur);
  }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g);
  g.connect(masterGain);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}

function noise() {
  if (!noiseBuf && audioCtx) {
    noiseBuf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.5), audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

// filtered noise burst: the "air/paper/fabric" layer of every sound
function filteredNoise(dur, ftype, freqFrom, freqTo, q, vol) {
  if (!sndOn || !audioCtx || !masterGain) return;
  const t0 = audioCtx.currentTime;
  const src = audioCtx.createBufferSource();
  src.buffer = noise();
  const filt = audioCtx.createBiquadFilter();
  filt.type = ftype;
  filt.Q.value = q || 1.2;
  filt.frequency.setValueAtTime(freqFrom, t0);
  filt.frequency.exponentialRampToValueAtTime(Math.max(1, freqTo), t0 + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt);
  filt.connect(g);
  g.connect(masterGain);
  src.start(t0);
  src.stop(t0 + dur + 0.05);
}

function swoosh(dur, freqFrom, freqTo, vol) {
  filteredNoise(dur, 'bandpass', freqFrom, freqTo, 1.2, vol);
}

// low sine drop: canvas thump / wood knock / wet body
function thump(freq, dur, vol) {
  if (!sndOn || !audioCtx || !masterGain) return;
  const t0 = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * 0.4), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

// single water/drip plip (main + rebound)
function playDrip(vol) {
  if (!sndOn || !audioCtx || !masterGain) return;
  const t0 = audioCtx.currentTime;
  const f = (480 + Math.random() * 380) * det();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f * 1.4, t0);
  o.frequency.exponentialRampToValueAtTime(f * 0.4, t0 + 0.065);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol || 0.06, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + 0.1);
}

// attach: rope catch (cloth thock + metal tick), wet kiss when close,
// turbo starts the climbing bed, repel sounds wrong and drops in pitch
function playAttach(type, dist) {
  if (!audioCtx) return;
  filteredNoise(0.07, 'bandpass', 170, 110, 1.7, 0.05);            // cloth thock
  tone((2000 + Math.random() * 500) * det(), 0.03, 'triangle', 0.045); // metal tick
  if (dist < 130) {
    tone(180 * det(), 0.09, 'sine', 0.09, 70);                     // suction body
    filteredNoise(0.10, 'bandpass', 950, 320, 1.0, 0.035);         // wet kiss
  }
  if (type === 'turbo') {
    startTurboBed();
  } else if (type === 'repel') {
    tone(260 * det(), 0.14, 'sawtooth', 0.06, 110);                // rubber snap, down
    filteredNoise(0.10, 'bandpass', 1400, 600, 2.2, 0.04);
    setTimeout(() => filteredNoise(0.08, 'bandpass', 900, 500, 1.5, 0.03), 60); // sticky peel
  }
}

// turbo: rising whoosh bed that keeps climbing while held
function startTurboBed() {
  if (!audioCtx) return;
  stopTurboBed();
  turboOsc = audioCtx.createOscillator();
  turboOsc.type = 'sine';
  turboOsc.frequency.value = 80;
  turboLp = audioCtx.createBiquadFilter();
  turboLp.type = 'lowpass';
  turboLp.frequency.value = 240;
  turboGain = audioCtx.createGain();
  turboGain.gain.value = 0;
  turboOsc.connect(turboLp);
  turboLp.connect(turboGain);
  turboGain.connect(masterGain);
  turboOsc.start();
}
function updateTurboBed(frac) {
  if (!audioCtx || !turboOsc || !turboGain) return;
  const t0 = audioCtx.currentTime;
  turboOsc.frequency.setTargetAtTime(80 + frac * 150, t0, 0.12);
  turboLp.frequency.setTargetAtTime(240 + frac * 980, t0, 0.12);
  turboGain.gain.setTargetAtTime(0.05 * frac, t0, 0.12);
}
function stopTurboBed() {
  if (turboGain && audioCtx) {
    const osc = turboOsc, g = turboGain;
    const t0 = audioCtx.currentTime;
    g.gain.setTargetAtTime(0, t0, 0.08);
    setTimeout(() => { try { osc.stop(); osc.disconnect(); g.disconnect(); } catch (e) {} }, 450);
    turboOsc = null; turboLp = null; turboGain = null;
  } else {
    turboOsc = turboLp = turboGain = null;
  }
}

// rope tension creak at the bottom of the arc (gated, per half-orbit)
function playCreak() {
  if (!audioCtx) return;
  filteredNoise(0.12, 'bandpass', 300, 150, 4, 0.045);
  tone(90 * det(), 0.12, 'sawtooth', 0.03, 120);
}

// release: the money sound. string snap + smosh whoosh + slosh + drips;
// fast = high & short, slow = low & wet
function playRelease(speed) {
  if (!audioCtx) return;
  stopTurboBed();
  const fast = speed > 14, slow = speed < 6;
  filteredNoise(0.05, 'highpass', 1800, 2600, 1.6, 0.05);               // string snap
  swoosh(fast ? 0.13 : slow ? 0.24 : 0.17,
         fast ? 1200 : slow ? 480 : 820,
         fast ? 2400 : slow ? 900 : 1500,
         fast ? 0.05 : 0.045);                                          // forward whoosh
  filteredNoise(0.11, 'bandpass', 420, 700, 0.9, 0.035);                // slosh as it tips
  for (let i = 0; i < (fast ? 5 : 3); i++) {
    setTimeout(() => playDrip(0.04), 20 + i * 28);                      // droplet spray
  }
  tone(140 * det(), 0.10, 'sine', 0.09, 60);                            // pop on the boost
}

// repel auto-release: rubber slap
function playKick() {
  if (!audioCtx) return;
  filteredNoise(0.08, 'bandpass', 1200, 400, 2, 0.06);
  tone(160 * det(), 0.12, 'sawtooth', 0.08, 70);
  swoosh(0.25, 320, 80, 0.05);
}

function playWin(tier) {
  if (!audioCtx) return;
  if (tier === 2) {
    // MASSIVE: feel it in the chest, then hear rain
    thumpEvent(150, 55, 0.35, 0.30);           // thump, starts a bit lower
    splatNoise(0.18, 400, 1800, 2.6, 0.085);   // loud, wider Q
    setTimeout(() => {                          // +40ms: canvas skin + a hair of wood
      canvasSkin(220, 90, 0.12, 0.05);
      canvasSkin(140, 70, 0.10, 0.035);
    }, 40);
    smearNoise(0.40, 0.05);                    // wet falling smear, under the drips
    rippleDrips(8, 80);
  } else if (tier === 1) {
    // POWER: plop + donk + a few drips
    thumpEvent(180, 55, 0.20, 0.22);
    splatNoise(0.12, 400, 1800, 1.8, 0.06);
    setTimeout(() => canvasSkin(220, 90, 0.08, 0.04), 40);
    smearNoise(0.20, 0.035);
    rippleDrips(4, 80);
  } else {
    // SOFT: one comic plop
    thumpEvent(180, 55, 0.08, 0.13);
    splatNoise(0.07, 400, 1600, 1.4, 0.05);
    rippleDrips(2, 80);
  }
}

// sine thump: 180->55 type bucket-mass drop (skewed per-tier below)
function thumpEvent(f0, f1, dur, vol) {
  if (!sndOn || !audioCtx || !masterGain) return;
  const t0 = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

// wet splash of bandpass noise, 400->1800 Hz then slam shut. Instant attack:
// if this fades in it becomes a whoosh, not a hit.
function splatNoise(dur, fLo, fHi, q, vol) {
  if (!sndOn || !audioCtx || !masterGain) return;
  const t0 = audioCtx.currentTime;
  const src = audioCtx.createBufferSource();
  src.buffer = noise();
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'bandpass';
  filt.Q.value = q || 1.6;
  filt.frequency.setValueAtTime(fLo, t0);
  filt.frequency.exponentialRampToValueAtTime(fHi, t0 + dur * 0.55);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.006);
  g.gain.exponentialRampToValueAtTime(vol * 0.6, t0 + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(t0); src.stop(t0 + dur + 0.02);
}

// stretched-cloth donk: short triangle 220->90, plus a hair of wood at ~140
function canvasSkin(f0, f1, dur, vol) {
  if (!sndOn || !audioCtx || !masterGain) return;
  const t0 = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.02);
}

// lowpassed noise, 900->200 - the wet smear, kept underneath the drips
function smearNoise(dur, vol) {
  if (!sndOn || !audioCtx || !masterGain) return;
  const t0 = audioCtx.currentTime;
  const src = audioCtx.createBufferSource();
  src.buffer = noise();
  const filt = audioCtx.createBiquadFilter();
  filt.type = 'lowpass';
  filt.frequency.setValueAtTime(900, t0);
  filt.frequency.exponentialRampToValueAtTime(200, t0 + dur);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt); filt.connect(g); g.connect(masterGain);
  src.start(t0); src.stop(t0 + dur + 0.02);
}

// fine droplets: sine blips 2-4 kHz, 20-40ms, random pitch (+-15%), staggered
function rippleDrips(count, startMs) {
  const base = [2200, 2600, 3000, 3400, 2400, 2800, 3200, 3600];
  for (let i = 0; i < count; i++) {
    const f = base[Math.min(i, base.length - 1)] * (0.85 + Math.random() * 0.30);
    const delay = startMs + i * (30 + Math.random() * 60);
    setTimeout(() => {
      if (!sndOn || !audioCtx || !masterGain) return;
      const t0 = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.035, t0 + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.02 + Math.random() * 0.02);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + 0.06);
    }, delay);
  }
}

function playLose(cause) {
  if (!audioCtx) return;
  if (cause === 'LEFT THE STUDIO!') {
    filteredNoise(0.4, 'lowpass', 1600, 300, 1.0, 0.05);                // whoosh falls off, dull
  } else {
    thump(140, 0.09, 0.1);                                              // dry wood knock
    setTimeout(() => { thump(110, 0.10, 0.08); filteredNoise(0.12, 'bandpass', 1000, 500, 1.5, 0.04); }, 70); // tape rip
  }
  // sad two-note, tiny
  tone(330 * det(), 0.22, 'sine', 0.055, 300);
  setTimeout(() => tone(262 * det(), 0.28, 'sine', 0.045, 220), 180);
}

// UI: paper page-turn / pencil tap (NEVER the attach sound)
function playTick() {
  if (!audioCtx) return;
  filteredNoise(0.035, 'bandpass', 1700, 1500, 2.6, 0.05);
  tone(1400 * det(), 0.025, 'triangle', 0.03);
}

// star result: three staggered paint drips (not slot-machine coins)
function playStarPop(stars) {
  if (!audioCtx) return;
  const fs = [640, 840, 1100];
  for (let i = 0; i < stars; i++) {
    setTimeout(() => {
      if (!audioCtx) return;
      const t0 = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(fs[i] * 1.35, t0);
      o.frequency.exponentialRampToValueAtTime(fs[i] * 0.5, t0 + 0.07);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.07, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
      o.connect(g); g.connect(masterGain);
      o.start(t0); o.stop(t0 + 0.1);
    }, i * 110);
  }
}

/* ============================================================
   INPUT (mouse + touch)
   ============================================================ */
const wrap = document.getElementById('wrap');
let lastTouch = 0;

/* ============================================================
   CANVAS FIT (contain / letterbox)
   The full 1400x850 room is always visible so the danger edges
   (out-of-bounds) stay on screen: the canvas is scaled down to
   fit the viewport and centered, leaving desk bars around it.
   HUD / footer / toast are re-pinned to the canvas box so they
   never float over the desk area.
   ============================================================ */
function fitLayout() {
  try {
    const wrapRect = wrap.getBoundingClientRect();
    const ww = wrap.clientWidth > 0 ? wrap.clientWidth : wrapRect.width;
    const wh = wrap.clientHeight > 0 ? wrap.clientHeight : wrapRect.height;
    const AR = W / H;
    let cw, ch;
    if (ww / wh > AR) { ch = wh; cw = wh * AR; }   // wide viewport: height-bound, side bars
    else              { cw = ww; ch = ww / AR; }   // tall viewport: width-bound, top/bottom bars
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    boundsOverlay.style.width = cw + 'px';
    boundsOverlay.style.height = ch + 'px';
    const r = canvas.getBoundingClientRect();
    const topPad = Math.max(0, r.top - wrapRect.top);
    const botPad = Math.max(0, wrapRect.bottom - r.bottom);
    const sidePad = Math.max(0, wrapRect.right - r.right);   // letterbox bars beside the canvas
    elHud.style.top = (topPad + 6) + 'px';
    elHud.style.right = (sidePad + 8) + 'px';
    elHudInfo.style.top = (topPad + 6) + 'px';
    elHudInfo.style.left = (r.left - wrapRect.left + 10) + 'px';
    elFooter.style.bottom = (botPad + 6) + 'px';
    elToast.style.top = (topPad + 14) + 'px';
  } catch (e) { /* layout is not critical to gameplay */ }
}
window.addEventListener('resize', fitLayout);
window.addEventListener('orientationchange', fitLayout);

function mouseDown() {
  if (Date.now() - lastTouch < 500) return;  // ignore synthetic mouse after touch
  ensureAudio();
  if (status === 'lost') { loadLevel(levelIndex); return; }  // tap to restart after game over
  if (status === 'ready') { launchBall(); return; }          // tap launches (no grab yet)
  if (status === 'paused') { togglePause(); return; }        // tap anywhere to resume
  tryAttach();
}
function mouseUp() {
  if (Date.now() - lastTouch < 500) return;
  release();
}

wrap.addEventListener('mousedown', mouseDown);
document.addEventListener('mouseup', mouseUp);

wrap.addEventListener('touchstart', (e) => {
  lastTouch = Date.now();
  // hands off while the level-select overlay is open
  if (elLevelSelect && !elLevelSelect.classList.contains('hidden')) return;
  const t = e.target;
  if (t && t.closest && t.closest('button')) return;   // presses on controls aren't gameplay
  if (t === canvas) e.preventDefault();                // stop scroll/zoom on the game surface
  ensureAudio();
  if (status === 'lost') { loadLevel(levelIndex); return; }  // tap screen to restart
  if (status === 'ready') { launchBall(); return; }          // tap launches (no grab yet)
  if (status === 'paused') { togglePause(); return; }        // tap anywhere to resume
  tryAttach();
}, { passive: false });

wrap.addEventListener('touchmove', (e) => { if (e.target === canvas) e.preventDefault(); }, { passive: false });

// NO preventDefault here: canceling touchend swallows the synthetic click,
// which is what made every button dead on phones.
document.addEventListener('touchend', (e) => {
  lastTouch = Date.now();
  release();
}, { passive: true });
document.addEventListener('touchcancel', (e) => { lastTouch = Date.now(); release(); }, { passive: true });

wrap.addEventListener('contextmenu', (e) => e.preventDefault());

function bindButton(el, handler) {
  el.addEventListener('mousedown', (e) => e.stopPropagation());
  el.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: false });
  el.addEventListener('click', handler);
}

// Restart button (also stop it from triggering an attach)
bindButton(elRestart, () => { ensureAudio(); playTick(); loadLevel(levelIndex); });

// NEXT LEVEL: advance (or wrap to level 1 after the last)
bindButton(elNextBtn, () => {
  ensureAudio(); playTick();
  const nextIdx = levelIndex + 1;
  loadLevel(nextIdx >= LEVELS.length ? 0 : nextIdx);
});

// ---------- HUD buttons ----------
function togglePause() {
  ensureAudio();
  if (status === 'playing')      { status = 'paused';  showPauseUI(true);  }
  else if (status === 'paused')  { status = 'playing'; showPauseUI(false); }
  playTick();
}
bindButton(elPause, togglePause);

// ---------- Sound toggle ----------
bindButton(elSnd, () => {
  ensureAudio();
  sndOn = !sndOn;
  elSnd.textContent = sndOn ? 'SOUND ON' : 'SOUND OFF';
  elSnd.setAttribute('aria-label', sndOn ? 'Sound on' : 'Sound off');
  setRush(sndOn ? rushTarget : 0);
  if (!sndOn) stopTurboBed();
});

// ---------- Back to menu ----------
function returnToMenu() {
  status = 'paused';
  setRush(0);
  stopTurboBed();
  elMsg.classList.add('hidden');
  closeLevelSelect();
  document.getElementById('title').style.display = '';
  elMenu.classList.remove('hidden');
}
bindButton(document.getElementById('menuBtn'), () => { ensureAudio(); playTick(); returnToMenu(); });

// ---------- Level Select overlay ----------
const elLevelSelect = document.getElementById('levelSelect');
const elLevelSelectGrid = document.getElementById('levelSelectGrid');
const elLevelSelectClose = document.getElementById('levelSelectClose');

function renderLevelSelect() {
  const save = loadSave();
  let html = '';
  for (let i = 1; i <= LEVELS.length; i++) {
    const idx = i - 1;
    const unlocked = save.unlocked.includes(idx);
    const rec = save.best[idx];
    const stars = rec ? '\u2605'.repeat(rec.stars) : (unlocked ? '' : '');
    html += `<button class="menuBtn" style="padding:12px;font-size:14px;" ${unlocked ? '' : 'disabled'} data-level="${idx}">${i}${unlocked ? ' ' + stars : ' \uD83D\uDD12'}</button>`;
  }
  elLevelSelectGrid.innerHTML = html;
  elLevelSelectGrid.querySelectorAll('button').forEach(btn => {
    const lvl = parseInt(btn.dataset.level, 10);
    const unlocked = save.unlocked.includes(lvl);
    const rec = save.best[lvl];
    const stars = rec ? rec.stars : 0;
    btn.setAttribute('aria-label', unlocked ? `Level ${lvl + 1}, ${stars} stars` : `Level ${lvl + 1}, locked`);
    btn.addEventListener('click', () => {
      const lvl2 = parseInt(btn.dataset.level, 10);
      if (!isNaN(lvl2)) {
        closeLevelSelect();
        loadLevel(lvl2);
      }
    });
  });
}

function openLevelSelect() {
  renderLevelSelect();
  elLevelSelect.classList.remove('hidden');
}

function closeLevelSelect() {
  elLevelSelect.classList.add('hidden');
}

elLevelSelectClose.addEventListener('click', () => {
  closeLevelSelect();
  elMenu.classList.remove('hidden');
});

// ---------- Reset saved progress ----------
const elResetProgress = document.getElementById('resetProgressBtn');
elResetProgress.addEventListener('mousedown', (e) => e.stopPropagation());
elResetProgress.addEventListener('touchstart', (e) => { e.stopPropagation(); }, { passive: false });
elResetProgress.addEventListener('click', () => {
  let ok = true;
  if (typeof confirm === 'function') ok = confirm('Reset all progress and best times? This cannot be undone.');
  if (ok) {
    writeSave({ unlocked: [0], best: {} });
    toast('Progress reset');
    renderLevelSelect();
  }
});

// ---------- Menu screen ----------
const elMenu = document.getElementById('menu');
const elMenuStart = document.getElementById('menuStartBtn');
const elMenuLevelSelect = document.getElementById('menuLevelSelectBtn');

elMenuStart.addEventListener('click', () => {
  elMenu.classList.add('hidden');
  // hide game title during gameplay
  document.getElementById('title').style.display = 'none';
  showReadyUI(true);
  status = 'ready';
  // resume at the furthest level reached, else level 1
  let resumeIdx = 0;
  try {
    const save = loadSave();
    if (save.unlocked && save.unlocked.length) {
      resumeIdx = Math.max(0, Math.min(LEVELS.length - 1, Math.max.apply(null, save.unlocked)));
    }
  } catch (e) { /* storage unavailable */ }
  levelIndex = resumeIdx;
  loadLevel(levelIndex);
  // first-time onboarding
  let fresh = false;
  try { fresh = typeof localStorage !== 'undefined' && !localStorage.getItem('neonOrbitSeen'); } catch (e) {}
  if (fresh) {
    try { localStorage.setItem('neonOrbitSeen', '1'); } catch (e) {}
    setTimeout(() => toast('HOLD to grab & swing · RELEASE to fly'), 800);
  }
});

elMenuLevelSelect.addEventListener('click', () => {
  elMenu.classList.add('hidden');
  openLevelSelect();
});

/* ============================================================
   GAME LOOP (60 fps)
   ============================================================ */
let last = performance.now();

function loop(now) {
  let dt = (now - last) / 16.667;   // normalized to a 60 fps step
  last = now;
  if (dt <= 0) dt = 1;
  if (dt > 3)  dt = 3;              // clamp big frame gaps (tab switch etc.)

  update(dt);
  draw();
  requestAnimationFrame(loop);
}

fitLayout();
loadLevel(0);
requestAnimationFrame(loop);
</script>
</body>
