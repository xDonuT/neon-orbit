<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PAINT ORBIT</title>
<style>
  :root {
    --neon-cyan: #1f8a9c;
    --neon-magenta: #a04d8c;
    --neon-green: #2f9e70;
    --neon-yellow: #c99a2e;
    --neon-red: #d64f3f;
    --neon-purple: #8a55b8;
    --text: #3d3530;
    --paper: #f2ecdd;
    --ink: #3d3530;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #cfc7b4;
    color: var(--text);
    font-family: 'Courier New', ui-monospace, monospace;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  #app {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    background: #cfc7b4;
  }

  /* ------- HUD top bar (overlay on canvas) ------- */
  #hud {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 6px);
    left: auto;
    right: calc(env(safe-area-inset-right, 0px) + 8px);
    z-index: 4;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    width: max-content;
    max-width: calc(100% - 12px);
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    pointer-events: auto;
  }
  #hudInfo {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 6px);
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    z-index: 4;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
    pointer-events: none;
    max-width: 50%;
    transition: opacity 0.6s ease;
  }
  #hudInfo.faded { opacity: 0; }
  #hudInfoRow {
    display: flex;
    align-items: baseline;
    gap: 10px;
    white-space: nowrap;
  }
  #title {
    font-size: 15px;
    font-weight: bold;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
    white-space: nowrap;
  }
  /* Level title (top-left, fades after 3s) */
  #levelTitle {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.15em;
    color: rgba(74, 64, 56, 0.75);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.85;
  }
  /* Timer (top-center, dripping paint style) */
  #hudTimerWrap {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 8px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    pointer-events: none;
  }
  #hudTimer {
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 0.1em;
    color: rgba(138, 106, 28, 0.85);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    padding: 2px 10px;
    background: rgba(247, 242, 228, 0.6);
    border-radius: 12px;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  #hudTimerWrap::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 100%;
    width: 2px;
    height: 6px;
    background: rgba(138, 106, 28, 0.4);
    border-radius: 0 0 2px 2px;
  }
  #levelLabel {
    font-size: 12px;
    color: #5a4a3a;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hud-btn {
    background: rgba(255, 250, 235, 0.4);
    border: 1px solid rgba(97, 76, 48, 0.2);
    color: #4a4038;
    font-family: inherit;
    border-radius: 50%;
    cursor: pointer;
    white-space: nowrap;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
    font-size: 16px;
    padding: 0;
    line-height: 1;
    width: 40px;
    height: 40px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .hud-btn:hover { background: rgba(255, 250, 235, 0.7); }
  .hud-btn:active { transform: scale(0.92); }

  /* ------- Canvas wrapper (full screen; canvas letterbox-fit via JS) ------- */
  #wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #cfc7b4;
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
  #gameArea {
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    overflow: hidden;
  }
  canvas, #bounds {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    aspect-ratio: 1400 / 850;
    touch-action: none;
    display: block;
  }
  #bounds {
    pointer-events: none;
    z-index: 7;
  }
  canvas { cursor: crosshair; }

  /* ------- Center message overlay ------- */
  #message {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: rgba(70, 52, 34, 0.35);
    text-align: center;
    z-index: 5;
    pointer-events: auto;
  }
  #message.hidden { display: none; }
  #msgTitle {
    font-size: clamp(36px, 8vmin, 84px);
    font-weight: bold;
    letter-spacing: 0.25em;
    color: var(--ink);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6), 0 2px 6px rgba(80, 60, 30, 0.28);
  }
  #message.lost #msgTitle { color: #a23c2c; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55), 0 2px 6px rgba(80, 60, 30, 0.3); }
  #msgStars {
    font-size: clamp(48px, 12vmin, 96px);
    letter-spacing: 0.3em;
    line-height: 1;
    color: #b57f16;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6), 0 2px 8px rgba(150, 110, 40, 0.35);
  }
  #msgStars .star {
    display: inline-block;
    animation: starPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  @keyframes starPop {
    0%   { transform: scale(0)   rotate(-20deg); opacity: 0; }
    60%  { transform: scale(1.3) rotate(8deg);  opacity: 1; }
    100% { transform: scale(1)   rotate(0deg);  opacity: 1; }
  }
  #msgScore {
    font-size: 18px;
    letter-spacing: 0.14em;
    color: #4a4038;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  #msgScore .best { color: #1f7a55; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
  #msgScore .newbest { color: #b57f16; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
  #msgSub {
    font-size: 18px;
    letter-spacing: 0.15em;
    color: #5a4a3a;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  #message.lost #msgSub { color: #8a6a1c; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5); }
  #msgObj {
    display: none;
    font-size: 16px;
    letter-spacing: 0.18em;
    color: #1f6a7d;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.5);
  }
  #restartBtn {
    font-family: inherit;
    font-size: 17px;
    letter-spacing: 0.18em;
    color: var(--ink);
    background: #f7f2e4;
    border: 1.5px solid rgba(97, 76, 48, 0.4);
    border-bottom-width: 3px;
    border-bottom-color: var(--neon-red);
    box-shadow: 0 2px 0 rgba(80, 60, 30, 0.18);
    padding: 14px 36px;
    border-radius: 6px;
    cursor: pointer;
    min-height: 44px;
  }
  #restartBtn:hover { background: #fdf9ee; }
  #restartBtn:active { transform: scale(0.97); }
  #msgBtns {
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: center;
  }
  #msgBtns.ready {
    flex-direction: column;
    align-items: stretch;
  }
  #msgBtns.ready #menuBtnMsg {
    order: -1;
    align-self: flex-end;
    margin-bottom: 12px;
    padding: 8px 16px;
    font-size: 12px;
  }
  #nextLevelBtn {
    font-family: inherit;
    font-size: 18px;
    letter-spacing: 0.18em;
    color: var(--ink);
    background: #f7f2e4;
    border: 1.5px solid rgba(97, 76, 48, 0.4);
    border-bottom-width: 3px;
    border-bottom-color: var(--neon-cyan);
    box-shadow: 0 2px 0 rgba(80, 60, 30, 0.18);
    padding: 15px 40px;
    border-radius: 6px;
    cursor: pointer;
    min-height: 44px;
  }
  #nextLevelBtn:hover { background: #fdf9ee; }
  #nextLevelBtn:active { transform: scale(0.97); }

  #toast {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    max-width: 86%;
    background: rgba(60, 45, 30, 0.88);
    border: 1px solid rgba(230, 205, 150, 0.55);
    color: #f7f1e3;
    font-size: 13px;
    letter-spacing: 0.16em;
    padding: 8px 18px;
    border-radius: 20px;
    white-space: nowrap;
    box-shadow: 0 2px 10px rgba(60, 45, 30, 0.35);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  #toast.show { opacity: 1; }

  /* ------- Footer instructions (overlay on canvas) ------- */
  #footer {
    position: absolute;
    bottom: 6px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    width: max-content;
    max-width: calc(100% - 12px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #5d5044;
    padding: 4px 10px;
    text-align: center;
    background: rgba(242, 236, 221, 0.78);
    border-radius: 6px;
    pointer-events: none;
  }
  /* ------- Menu screen (start screen) ------- */
  #menu {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(242, 236, 221, 0.92);
    color: var(--ink);
    gap: 24px;
    overflow: hidden;
  }
  #menu.hidden { display: none; }
  #menuTitle { font-size: clamp(32px, 8vmin, 72px); font-weight: bold; letter-spacing: 0.3em; color: var(--ink); text-shadow: 0 2px 0 rgba(255,255,255,0.85), 0 3px 10px rgba(80, 60, 30, 0.3); }
  #menuSub { font-size: 14px; color: #6b5f4f; letter-spacing: 0.15em; margin-bottom: 32px; }
  .menuBtn { font-family: inherit; font-size: 16px; letter-spacing: 0.2em; color: var(--ink); background: rgba(255, 250, 235, 0.6); border: 1px solid rgba(97, 76, 48, 0.4); padding: 12px 28px; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
  .menuBtn:hover { background: rgba(255, 250, 235, 0.9); }
  .menuBtn:active { transform: scale(0.98); }
  .levelsInfo { font-size: 12px; color: #6b5f4f; letter-spacing: 0.1em; }
  /* ------- Level Select overlay ------- */
  #levelSelect {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--ink);
    padding: 20px;
    overflow-y: auto;
    background: rgba(242, 236, 221, 0.94);
  }
  #levelSelect:not(.hidden) { display: flex; }
  .dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    vertical-align: middle;
    margin-right: 4px;
    box-shadow: 0 1px 2px rgba(60, 40, 20, 0.35);
  }
  .d-green  { background: var(--neon-green);  color: var(--neon-green); }
  .d-yellow { background: var(--neon-yellow); color: var(--neon-yellow); }
  .d-red    { background: var(--neon-red);    color: var(--neon-red); }
  .d-purple { background: var(--neon-purple); color: var(--neon-purple); }
  .instr-item { white-space: nowrap; }

  @media (min-width: 701px) {
    #levelTitle { font-size: 14px; }
    #hudTimer { font-size: 16px; padding: 2px 12px; }
    .hud-btn { width: 44px; height: 44px; font-size: 18px; }
  }
  /* ------- Right control panel sidebar ------- */
  #sidePanel {
    flex: 0 0 auto;
    width: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 8px
             calc(env(safe-area-inset-bottom, 0px) + 8px);
    background: #e7dfc9;
    border-left: 2px solid rgba(97, 76, 48, 0.18);
    box-shadow: inset 1px 0 0 rgba(255, 251, 240, 0.6);
    overflow: hidden;
    z-index: 4;
  }
  #sidePanel.hidden { display: none; }
  @media (min-width: 701px) { #sidePanel { width: 190px; } }
  /* HUD cluster: level info + pause/sound/menu */
  #hudPanel {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  #sidePanel #hudInfo {
    position: static;
    top: auto; left: auto; right: auto;
    max-width: 100%;
    pointer-events: auto;
    padding: 0;
    text-align: center;
  }
  #sidePanel #hud {
    position: static;
    top: auto; left: auto; right: auto;
    width: 100%;
    justify-content: center;
    gap: 6px;
  }
  #sidePanel .hud-btn { width: 40px; height: 40px; font-size: 16px; }
  @media (min-width: 701px) {
    #sidePanel .hud-btn { width: 44px; height: 44px; font-size: 18px; }
  }
  #sidePanel #levelTitle {
    font-size: 11px;
    line-height: 1.4;
    letter-spacing: 0.12em;
  }
  @media (min-width: 701px) and (max-width: 900px) {
    #sidePanel #levelTitle { font-size: 12px; }
  }

  /* Bucket paint-well: the bean-eyed pal who holds the current color */
  #paintWell {
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px 0 6px;
    filter: drop-shadow(0 1px 2px rgba(60, 40, 20, 0.2));
    transition: transform 0.2s ease;
  }
  #paintWell.pop { transform: scale(1.12); }
  #paintWell svg { display: block; }
  #paintWellFill { transition: fill 0.25s ease; }

  /* ------- Control circle (striped = grab target) ------- */
  #controlCircleWrap {
    flex: 0 0 auto;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    margin: auto 0;
  }
  #sidePanel.hideCircle #controlCircleWrap { display: none; }
  #controlCircle {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(255, 250, 235, 0.5);
    border: 2px solid rgba(97, 76, 48, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    touch-action: none;
    transition: all 0.15s ease;
    position: relative;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6), 0 2px 5px rgba(80, 60, 30, 0.18);
  }
  @media (min-width: 701px) {
    #controlCircle { width: 110px; height: 110px; }
  }
  #controlCircle::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    border: 1px dashed rgba(97, 76, 48, 0.3);
  }
  #controlCircle:hover {
    background: rgba(255, 250, 235, 0.65);
    border-color: rgba(97, 76, 48, 0.5);
  }
  #controlCircle.held {
    transform: scale(0.96);
    background: rgba(184, 135, 27, 0.28);
    border-color: rgba(184, 135, 27, 0.65);
    box-shadow: 0 1px 0 rgba(255,255,255,0.4), 0 0 0 4px rgba(184, 135, 27, 0.15), 0 2px 8px rgba(80, 60, 30, 0.3);
  }
  #controlCircle.hidden { background: transparent; }
  #controlLabel {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #5a4a3a;
    text-align: center;
    line-height: 1.3;
    z-index: 1;
    pointer-events: none;
  }
  @media (min-width: 701px) {
    #controlLabel { font-size: 11px; }
  }
  #hideCircleBtn {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 6px;
    font-size: 10px;
    font-family: inherit;
    color: #8a6a1c;
    background: transparent;
    border: 1px solid rgba(97, 76, 48, 0.3);
    border-radius: 4px;
    cursor: pointer;
    vertical-align: middle;
  }
  #hideCircleBtn:hover { background: rgba(255, 250, 235, 0.6); }
  /* ------- Guide section (bottom) ------- */
  #guideSection {
    flex: 0 1 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #5a4a3a;
    padding: 6px 0;
  }
  #guideSection.hideCircle { padding-bottom: 2px; }
  @media (min-width: 701px) {
    #guideSection { gap: 6px; font-size: 12px; }
  }
  #guideTitle {
    font-size: 10px;
    letter-spacing: 0.15em;
    color: #8a6a1c;
    margin-bottom: 2px;
    font-weight: bold;
    white-space: nowrap;
  }
  @media (min-width: 701px) {
    #guideTitle { font-size: 11px; }
  }
  .guideItem { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .instr-item { white-space: nowrap; opacity: 0.85; }

  /* ------- Portrait rotate prompt ------- */
  #rotatePrompt {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(242, 236, 221, 0.97);
    color: var(--ink);
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    padding: 24px;
  }
  #rotatePrompt.show { display: flex; }
  #rotateIcon { font-size: 64px; animation: rotateHint 2.4s ease-in-out infinite; }
  @keyframes rotateHint {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }
  #rotateText { font-size: 18px; letter-spacing: 0.1em; max-width: 280px; }
  #rotateDismiss {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--ink);
    background: rgba(255, 250, 235, 0.6);
    border: 1px solid rgba(97, 76, 48, 0.4);
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
  }

  /* ------- Compact layout for short / landscape phones ------- */
  @media (max-height: 520px) {
    #levelTitle { font-size: 11px; }
    #hudTimer { font-size: 12px; padding: 1px 8px; }
    .hud-btn { width: 36px; height: 36px; font-size: 14px; }
  }
  @media (orientation: portrait) and (max-width: 900px) {
    #rotatePrompt { display: flex; }
    #rotatePrompt.dismissed { display: none; }
  }
</style>
</head>
<body>
<div id="rotatePrompt">
  <div id="rotateIcon">📱↻</div>
  <div id="rotateText">Rotate your phone to landscape for the best experience</div>
  <button id="rotateDismiss" aria-label="Dismiss rotate prompt">PLAY ANYWAY</button>
</div>
<div id="app">
  <!-- Menu screen (start screen, hidden after tap) -->
  <div id="menu">
    <div id="menuTitle">PAINT&nbsp;ORBIT</div>
    <div id="menuSub">Keep a brush, ruin a canvas.</div>
<button class="menuBtn" id="menuStartBtn" aria-label="Start game">Play</button>
<button class="menuBtn" id="menuLevelSelectBtn" aria-label="Level select">Level Select</button>
    <div class="levelsInfo">Levels 1–25</div>
  </div>

  <!-- Game: full screen, canvas + overlays -->
  <div id="wrap">
    <!-- Left: game area (canvas + overlays) -->
    <div id="gameArea">
<canvas id="game" width="1400" height="850" aria-label="Game canvas"></canvas>

<!-- Red danger edge overlay: sits ABOVE the HUD so nothing covers it -->
<canvas id="bounds" width="1400" height="850" aria-hidden="true"></canvas>
      <div id="hudTimerWrap">
        <div id="hudTimer">0:00</div>
      </div>

      <!-- Level Select overlay (hidden by default) -->
      <div id="levelSelect" class="hidden">
        <h3 style="font-size:clamp(24px,5vmin,48px);font-weight:bold;letter-spacing:0.2em;margin-bottom:16px;">PICK A CANVAS</h3>
        <div id="levelSelectGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;width:100%;max-width:400px;"></div>
        <div style="display:flex;gap:12px;margin-top:16px;">
<button class="menuBtn" id="levelSelectClose" aria-label="Close level select">Close</button>
<button class="menuBtn" id="resetProgressBtn" style="border-color:rgba(154,58,40,0.6);color:#7a2c22;" aria-label="Reset progress">Reset Progress</button>
        </div>
      </div>

      <div id="message" class="hidden" aria-live="assertive">
        <div id="msgTitle"></div>
        <div id="msgStars"></div>
        <div id="msgScore"></div>
        <div id="msgObj"></div>
        <div id="msgSub"></div>
        <div id="msgBtns">

function starsForTime(li, t) {
  const p = PAR3[li];
  if (t <= p) return 3;
  if (t <= p * 1.6) return 2;
  if (t <= p * 3.0) return 1;
  return 0;
}

  if (elPaintWellFill) elPaintWellFill.style.fill = 'rgb(' + rgb + ')';

    elPaintWell.classList.remove('pop');
    void elPaintWell.offsetWidth;   // restart animation
    elPaintWell.classList.add('pop');
  }
}

function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = s - m * 60;
  return m > 0 ? m + ':' + String(sec.toFixed(1)).padStart(4, '0') : sec.toFixed(1) + 's';
}

// ---- Persisted progress & best times ----
// save = { unlocked: [0,3,...] (indices the player may enter), best: { "3": {stars, time}, ... } }
function loadSave() {
  try {
    if (typeof localStorage === 'undefined') return { unlocked: [0], best: {} };
    const raw = localStorage.getItem('neonOrbitSave');
    if (raw) {
      const s = JSON.parse(raw);
      if (Array.isArray(s.unlocked)) return { unlocked: s.unlocked, best: s.best || {} };
    }
    // migrate legacy neonOrbitCompleted array -> unlocked list
    const legacy = localStorage.getItem('neonOrbitCompleted');
    if (legacy) {
      const arr = JSON.parse(legacy);
      if (Array.isArray(arr)) return { unlocked: arr, best: {} };
    }
  } catch (e) { /* storage unavailable */ }
  return { unlocked: [0], best: {} };
}
function writeSave(s) {
  try { if (typeof localStorage !== 'undefined') localStorage.setItem('neonOrbitSave', JSON.stringify(s)); } catch (e) {}
}

const elToast  = document.getElementById('toast');
let toastTimer = 0;
const shownToasts = new Set();

function toast(text) {
  if (shownToasts.has(text)) return;     // show each hint once per session
  shownToasts.add(text);
  elToast.textContent = text;
  elToast.classList.add('show');
  toastTimer = 2.2;
}

// First tap on the canvas starts the level: the ball gently hovers/drifts
// toward the first orb instead of slinging away. The actual grab happens on
// the next press-and-hold.
function launchBall() {
  status = 'playing';
  showReadyUI(false);
  const o = level.orbs[0];
  const d = Math.hypot(o.x - player.x, o.y - player.y) || 1;
  player.vx = (o.x - player.x) / d * 3.5;   // slow float into the opening swing
  player.vy = (o.y - player.y) / d * 3.5;
}

function showReadyUI(on) {
  if (on) {
    elMsg.classList.remove('lost');
    elMsg.classList.remove('hidden');
    elMsgT.textContent = 'TAP TO LAUNCH';
    elMsgObj.style.display = '';
    elMsgObj.textContent = level && level.walls && level.walls.length
      ? 'OBJECTIVE: swing past the tape to the signing spot'
      : 'OBJECTIVE: reach the signing spot';
    elMsgS.textContent = 'tap to start \u00b7 then hold to swing, release to fly';
    elRestart.style.display = 'none';
    elNextBtn.style.display = 'none';
    elMsgBtns.classList.add('ready');
  } else {
    elMsg.classList.add('hidden');
  }
}

function showPauseUI(on) {
  if (on) {
    elMsg.classList.remove('lost');
    elMsg.classList.remove('hidden');
    elMsgT.textContent = 'PAUSED';
    elMsgObj.style.display = 'none';
    elMsgS.textContent = 'tap anywhere to resume';
    elRestart.style.display = 'none';
    elNextBtn.style.display = 'none';
  } else {
    elMsg.classList.add('hidden');
  }
}

function loadLevel(idx) {
  if (idx >= LEVELS.length) idx = 0;
  clearPaintLayer();   // new canvas to mangle each level
  levelIndex = idx;
  level = LEVELS[idx];
  player = { x: level.player.x, y: level.player.y, vx: 0, vy: 0 };
  goalGrad = null;
  tethered = false;
  tether = null;
  trail = [];
  snap = 0;
  stretchEase = 1;
  tetherSproing = 0;
  paintRGB = '248,245,238';
  setPaintWell(paintRGB);
  stopTurboBed();
  lastBelow = null;
  creakCd = 0;
  dripAcc = 0;
  sparks.length = 0;
  rings.length = 0;
  beams.length = 0;
  tetherParticles.length = 0;
  winHalt = 0;
  winSlow = 0;
  flashAlpha = 0;
  landTier = 0;
  winLabelT = 0;
  status = 'ready';
  statusTimer = 0;
  runTime = 0;
  elHudTimer.textContent = fmtTime(0);
  elLevelTitle.textContent = 'LEVEL ' + (idx + 1) + ' \u2014 ' + level.name;
  elHudInfo.classList.remove('faded');
  setTimeout(() => elHudInfo.classList.add('faded'), 3000);
  pathFadeAt = -1;                        // fresh route hint each level
  // one-time orb legend (replaces the old footer)
  if (idx === 0) toast('HOLD to grab & swing \u00b7 RELEASE to fly');
  if (idx === 3) toast('YELLOW orb = cadmium \u00b7 speeds you up');
  if (idx === 6) toast('RED orb = alizarin \u00b7 kicks you loose');
  if (level.walls && level.walls.length) toast('Dunk under the tape!');
  showReadyUI(true);
  // close level select overlay if open
  closeLevelSelect();
  elLevelTitle.textContent = 'LEVEL ' + (idx + 1) + ' \u2014 ' + level.name;
  elMsgStars.textContent = '';
  elMsgScore.textContent = '';
  elNextBtn.style.display = 'none';
}
